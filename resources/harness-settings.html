<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#21262d; --text:#e6edf3; --muted:#8b949e;
          --accent:#4f8cff; --danger:#f85149; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#ffffff; --panel:#f6f8fa; --border:#d0d7de; --text:#1f2328; --muted:#57606a;
            --accent:#0969da; --danger:#cf222e; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; font-size:14px; }
  main { padding: 18px 22px; overflow-y:auto; height:100%; }
  h1 { font-size:16px; margin:0 0 16px; font-weight:600; }
  h2 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;
    margin:20px 0 10px; font-weight:600; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:11px 14px; margin-bottom:8px; }
  .row .label { font-size:13px; }
  .row .sub { color:var(--muted); font-size:11px; margin-top:2px; }
  select, input, button { background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 10px; font-size:13px; }
  select { cursor:pointer; }
  input[type=number] { width:84px; text-align:right; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .inputgroup { display:flex; align-items:center; gap:6px; }
  .inputgroup .unit { color:var(--muted); font-size:12px; }
  .inputgroup button { padding:6px 8px; }
  .hint { color:var(--muted); font-size:12px; margin:-4px 2px 10px; line-height:1.5; white-space:pre-line; }
  .hint.warn { color:var(--danger); }
  .actions { display:flex; justify-content:flex-end; margin:14px 0 4px; }
  .errorbox { text-align:center; padding:48px 20px; }
  .errorbox .msg { color:var(--muted); margin-bottom:16px; }
  .row .status { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">Harness 设置</h1>

  <div id="errorState" class="errorbox" hidden>
    <div class="msg" id="errorText">无法读取 Harness 设置</div>
    <button id="retryLoad" class="primary">重试</button>
  </div>

  <div id="content" hidden>
    <h2 id="secModel">模型请求</h2>
    <div class="row"><div><div class="label" id="lblProvider">提供方</div></div>
      <select id="provider"></select></div>
    <div class="row"><div><div class="label" id="lblRetry">请求失败重试</div></div>
      <select id="retry">
        <option value="harness-default">Harness 默认</option>
        <option value="recommended">推荐</option>
        <option value="unstable">网络不稳定</option>
        <option value="always">持续重试</option>
        <option value="custom" disabled>自定义</option>
      </select></div>
    <div class="hint" id="retryDetail"></div>

    <div class="row" id="rowTimeoutMs" hidden><div><div class="label" id="lblTimeout">请求超时</div>
      <div class="sub" id="subTimeout">模型请求超过该时长未返回即判定失败。</div></div>
      <div class="inputgroup"><input type="number" id="timeoutMs" min="1" placeholder="—">
        <span class="unit">秒</span><button id="resetTimeoutMs">恢复默认</button></div></div>

    <div class="row" id="rowStreamIdle" hidden><div><div class="label" id="lblStreamIdle">流式响应空闲超时</div>
      <div class="sub" id="subStreamIdle">模型已建立连接但长时间没有新的流式数据时，等待多久后判定请求失效。</div></div>
      <div class="inputgroup"><input type="number" id="streamIdle" min="1" placeholder="—">
        <span class="unit">秒</span><button id="resetStreamIdle">恢复默认</button></div></div>

    <div class="row" id="rowWs" hidden><div><div class="label" id="lblWs">WebSocket 连接超时</div>
      <div class="sub" id="subWs">与提供方的 WebSocket 连接建立超时时间。</div></div>
      <div class="inputgroup"><input type="number" id="ws" min="1" placeholder="—">
        <span class="unit">秒</span><button id="resetWs">恢复默认</button></div></div>

    <div class="hint" id="appliesHint"></div>
    <div class="actions"><button id="apply" class="primary" disabled>应用修改</button></div>

    <h2 id="secAdvanced">高级</h2>
    <div class="row"><div><div class="label" id="lblStatus">Harness 当前状态</div><div class="sub status" id="status">运行中</div></div>
      <button id="restart">重启 Harness</button></div>
  </div>
</main>
<script src="harness-settings.js"></script>
</body>
</html>
