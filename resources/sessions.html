<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<script src="shell-theme.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#21262d; --text:#e6edf3; --muted:#8b949e;
          --accent:#4f8cff; --ok:#3fb950; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#ffffff; --panel:#f6f8fa; --border:#d0d7de; --text:#1f2328; --muted:#57606a;
            --accent:#0969da; --ok:#1a7f37; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; font-size:14px; }
  main { display:flex; flex-direction:column; height:100%; padding:14px 18px; gap:10px; }
  .top { display:flex; gap:8px; align-items:center; }
  h1 { font-size:15px; margin:0 auto 0 0; font-weight:600; }
  input[type=search] { flex:1; background:var(--panel); color:var(--text);
    border:1px solid var(--border); border-radius:6px; padding:7px 10px; font-size:13px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; }
  label.toggle { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:5px; }
  input[type=checkbox] { accent-color: var(--accent); }
  #list { flex:1; overflow-y:auto; }
  .row { background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:10px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
  .row .body { flex:1; min-width:0; }
  .row .t { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .m { color:var(--muted); font-size:11.5px; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { font-size:11px; border-radius:10px; padding:2px 8px; flex:none; }
  .badge.running { background:rgba(63,185,80,.15); color:var(--ok); }
  .empty { color:var(--muted); text-align:center; padding:40px 0; font-size:13px; }
  .footer { color:var(--muted); font-size:11px; }
  .msg { font-size:12.5px; min-height:0; }
  .msg.err { color:#f85149; } .msg.ok { color:var(--ok); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="title">会话历史</h1>
    <input type="search" id="q" placeholder="">
    <button id="refresh"></button>
  </div>
  <label class="toggle"><input type="checkbox" id="showBlank"><span id="lblBlank"></span></label>
  <div id="list"></div>
  <div class="msg" id="msg"></div>
  <div class="footer" id="footer"></div>
</main>
<script src="sessions.js"></script>
</body>
</html>
