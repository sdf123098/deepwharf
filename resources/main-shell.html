<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<script src="shell-theme.js"></script>
<style>
  :root { --bar-bg:var(--bg,#0d1117); --bar-border:var(--border,#1b2130); --bar-text:var(--text,#e6edf3);
          --bar-muted:var(--muted,#9aa7bd); --bar-hover:var(--panel,#1b2434); }
  @media (prefers-color-scheme: light) {
    :root { --bar-bg:#ffffff; --bar-border:#e3e6ea; --bar-text:#1a1f28; --bar-muted:#5a6472; --bar-hover:#eef1f5; }
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bar-bg);
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--bar-text); }
  body { display: flex; flex-direction: column; }
  /* Single merged title bar: draggable, with native window controls overlaid on the right. */
  #titlebar { flex: 0 0 40px; display: flex; align-items: center; gap: 4px;
    padding: 0 138px 0 10px; /* right space reserved for native min/max/close overlay */
    background: var(--bar-bg); border-bottom: 1px solid var(--bar-border);
    -webkit-app-region: drag; user-select: none; }
  #titlebar .logo { width: 20px; height: 20px; border-radius: 5px; margin-right: 8px; }
  #titlebar .title { font-size: 13px; font-weight: 600; margin-right: 14px; color: var(--bar-text); }
  #titlebar button { -webkit-app-region: no-drag; background: transparent; color: var(--bar-muted);
    border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #titlebar button:hover { background: var(--bar-hover); color: var(--bar-text); }
  webview { flex: 1; width: 100%; border: none; }
</style>
</head>
<body>
  <div id="titlebar">
    <img class="logo" src="brand-logo.png" alt="DeepWharf">
    <span class="title">DeepWharf</span>
    <button id="btnSessions">会话</button>
    <button id="btnUsage">用量</button>
    <button id="btnStore">插件商店</button>
    <button id="btnPluginManager">插件管理</button>
    <button id="btnSettings">外壳设置</button>
    <button id="btnHarnessSettings">Harness 设置</button>
  </div>
  <webview id="harness" preload=""></webview>
  <script src="main-shell.js"></script>
</body>
</html>
