<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<script src="shell-theme.js"></script>
<style>
  :root { --bar-bg:var(--bg,#0d1117); --bar-border:var(--border,#1b2130); --bar-text:var(--text,#e6edf3);
          --bar-muted:var(--muted,#9aa7bd); --bar-hover:var(--panel,#1b2434); }
  @media (prefers-color-scheme: light) {
    :root { --bar-bg:#ffffff; --bar-border:#e3e6ea; --bar-text:#1a1f28; --bar-muted:#5a6472; --bar-hover:#eef1f5; }
  }
  * { box-sizing: border-box; }
  /* the hidden attribute must win over author display rules (e.g. .dwPrompt) */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bar-bg);
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--bar-text); }
  body { display: flex; }

  /* Codex-style left rail: a header row (logo + icon actions) over the session
     list, spanning the full window height; the right column holds the drag
     strip (native controls overlay top-right) + the harness webview. */
  #sidebar { flex: 0 0 250px; display: flex; flex-direction: column; min-width: 0;
    background: var(--bar-bg); border-right: 1px solid var(--bar-border); }
  #sidebar.collapsed { display: none; }
  #sideHead { height: 40px; flex: 0 0 40px; display: flex; align-items: center; gap: 4px;
    padding: 0 8px 0 12px; -webkit-app-region: drag; user-select: none;
    border-bottom: 1px solid var(--bar-border); }
  #sideHead .logo { width: 20px; height: 20px; border-radius: 5px; }
  #sideHead .title { font-size: 13px; font-weight: 600; margin-right: auto; white-space: nowrap; }
  #sideHead button { -webkit-app-region: no-drag; width: 30px; height: 28px; flex: none;
    display: grid; place-items: center; background: transparent; color: var(--bar-muted);
    border: none; border-radius: 6px; cursor: pointer; }
  #sideHead button:hover { background: var(--bar-hover); color: var(--bar-text); }
  #sideHead button svg { width: 17px; height: 17px; display: block; }

  #sessionActions { flex: none; display: flex; gap: 6px; padding: 8px 8px 4px; }
  #btnNewSession { flex: 1; background: var(--accent, #4f8cff); color: #fff; border: none;
    border-radius: 7px; padding: 6px 8px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    font-family: inherit; }
  #btnNewSession:hover { filter: brightness(1.08); }
  #btnNewWorkspace { background: transparent; color: var(--bar-muted); border: 1px solid var(--bar-border);
    border-radius: 7px; padding: 5px 8px; font-size: 12px; cursor: pointer; font-family: inherit;
    white-space: nowrap; }
  #btnNewWorkspace:hover { color: var(--bar-text); border-color: var(--bar-muted); }
  #sessionList { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 8px; }
  .sessGroup { margin-bottom: 10px; }
  .sessGroupHead { display: flex; align-items: center; gap: 4px; padding: 4px 8px;
    font-size: 11px; font-weight: 600; color: var(--bar-muted); text-transform: uppercase;
    letter-spacing: .4px; user-select: none; }
  .sessGroupHead .g-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .sessGroupHead .g-menu { width: 20px; height: 18px; border: none; background: transparent;
    color: var(--bar-muted); border-radius: 5px; cursor: pointer; font-size: 13px; line-height: 1;
    display: grid; place-items: center; }
  .sessGroupHead .g-menu:hover { background: var(--bar-hover); color: var(--bar-text); }
  .sess { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; color: var(--bar-text); border: none; border-radius: 8px;
    padding: 8px 10px; cursor: pointer; font-family: inherit; }
  .sess:hover { background: var(--bar-hover); }
  .sess.active { background: var(--bar-hover); outline: 1px solid var(--bar-border); }
  .sess .dot { width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--bar-border); }
  .sess .dot.run { background: #3fb950; box-shadow: 0 0 0 3px rgba(63,185,80,.15); }
  .sess .body { flex: 1; min-width: 0; }
  .sess .t { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .sess .m { font-size: 10.5px; color: var(--bar-muted); margin-top: 1px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .sess .sessMenu { flex: none; width: 20px; height: 20px; border-radius: 6px; border: none;
    background: transparent; color: var(--bar-muted); cursor: pointer; display: none;
    place-items: center; font-size: 14px; line-height: 1; }
  .sess:hover .sessMenu { display: grid; }
  .sess .sessMenu:hover { color: var(--bar-text); background: var(--bar-border); }
  .sessEmpty { color: var(--bar-muted); font-size: 12px; text-align: center; padding: 24px 8px; line-height: 1.7; }

  /* floating context menu (session / workspace actions) */
  .dwMenu { position: fixed; z-index: 100; min-width: 130px; background: var(--bar-bg);
    border: 1px solid var(--bar-border); border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .dwMenu button { display: block; width: 100%; text-align: left; background: transparent;
    color: var(--bar-text); border: none; border-radius: 6px; padding: 6px 10px;
    font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .dwMenu button:hover { background: var(--bar-hover); }
  .dwMenu button.danger { color: #f85149; }

  #sideFoot { flex: none; padding: 8px; border-top: 1px solid var(--bar-border); display: flex;
    flex-direction: column; gap: 8px; }
  .footRow { display: flex; gap: 6px; }
  .footRow button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
    background: var(--bar-hover); color: var(--bar-text); border: 1px solid var(--bar-border);
    border-radius: 7px; padding: 5px 8px; font-size: 12px; cursor: pointer; font-family: inherit;
    white-space: nowrap; }
  .footRow button:hover { border-color: var(--bar-muted); }
  .footActions { display: flex; flex-direction: column; gap: 2px; }
  .footAct { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; color: var(--bar-muted); border: none; border-radius: 6px;
    padding: 5px 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .footAct svg { width: 14px; height: 14px; flex: none; }
  .footAct:hover { background: var(--bar-hover); color: var(--bar-text); }

  #maincol { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #titlebar { flex: 0 0 40px; height: 40px; -webkit-app-region: drag;
    background: var(--bar-bg); }
  webview { flex: 1; width: 100%; border: none; }

  /* expand handle: floats at the top-left edge while the sidebar is collapsed */
  #btnExpand { position: fixed; top: 7px; left: 8px; z-index: 20; width: 30px; height: 28px;
    display: none; place-items: center; background: var(--bar-hover); color: var(--bar-muted);
    border: 1px solid var(--bar-border); border-radius: 7px; cursor: pointer;
    -webkit-app-region: no-drag; }
  #btnExpand svg { width: 15px; height: 15px; display: block; }
  #btnExpand:hover { color: var(--bar-text); }
  #sidebar.collapsed ~ #maincol ~ #btnExpand,
  body.sidebar-collapsed #btnExpand { display: grid; }

  /* prompt modal (Electron lacks window.prompt) */
  .dwPrompt { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; }
  .dwPromptBox { width: 340px; max-width: 90vw; background: var(--bar-bg);
    border: 1px solid var(--bar-border); border-radius: 10px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4); }
  .dwPromptTitle { font-size: 13.5px; font-weight: 600; margin-bottom: 10px; }
  .dwPromptBox input { width: 100%; background: var(--bar-hover); color: var(--bar-text);
    border: 1px solid var(--bar-border); border-radius: 7px; padding: 8px 10px;
    font-size: 13px; outline: none; font-family: inherit; }
  .dwPromptBox input:focus { border-color: var(--accent, #4f8cff); }
  .dwPromptActions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .dwPromptActions button { background: var(--bar-hover); color: var(--bar-text);
    border: 1px solid var(--bar-border); border-radius: 7px; padding: 6px 14px;
    font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .dwPromptActions button.primary { background: var(--accent, #4f8cff); border-color: var(--accent, #4f8cff);
    color: #fff; }
</style>
</head>
<body>
  <aside id="sidebar">
    <div id="sideHead">
      <img class="logo" src="brand-logo.png" alt="DeepWharf">
      <span class="title">DeepWharf</span>
      <button id="btnCollapse" title="折叠侧边栏 (Ctrl+Shift+S)" aria-label="折叠侧边栏">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 6 8l4 5"/></svg>
      </button>
    </div>
    <div id="sessionActions">
      <button id="btnNewSession">＋ 新会话</button>
      <button id="btnNewWorkspace" title="新建工作区">＋ 工作区</button>
    </div>
    <div id="sessionList"><div class="sessEmpty">加载会话…</div></div>
    <div id="sideFoot">
      <div class="footActions">
        <button class="footAct" id="btnStore" title="插件商店">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5 4 2.5h8L13.5 5M3 5h10v8.5H3zM5.5 8v1M8 8v1M10.5 8v1"/></svg>
          <span>插件商店</span></button>
        <button class="footAct" id="btnSettings" title="设置">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg>
          <span>设置</span></button>
        <button class="footAct" id="btnWebuiSettings" title="Web UI 设置">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h12M2 11h12M5 3v4M11 9v4"/></svg>
          <span>Web UI 设置</span></button>
      </div>
    </div>
  </aside>
  <div id="maincol">
    <div id="titlebar"></div>
    <webview id="harness" preload="webui-preload.js"></webview>
  </div>
  <button id="btnExpand" title="展开侧边栏 (Ctrl+Shift+S)" aria-label="展开侧边栏">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l4 5-4 5"/></svg>
  </button>

  <!-- Electron does not support window.prompt(); this modal replaces it. -->
  <div id="dwPrompt" class="dwPrompt" hidden>
    <div class="dwPromptBox">
      <div class="dwPromptTitle" id="dwPromptTitle"></div>
      <input id="dwPromptInput" type="text" spellcheck="false">
      <div class="dwPromptActions">
        <button id="dwPromptCancel"></button>
        <button id="dwPromptOk" class="primary"></button>
      </div>
    </div>
  </div>

  <script src="main-shell.js"></script>
</body>
</html>
