<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Plugin Store</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#21262d; --text:#e6edf3; --muted:#8b949e;
          --accent:#4f8cff; --green:#3fb950; --danger:#f85149; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#ffffff; --panel:#f6f8fa; --border:#d0d7de; --text:#1f2328; --muted:#57606a;
            --accent:#0969da; --green:#1a7f37; --danger:#cf222e; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; font-size:14px; }
  header { display:flex; align-items:center; gap:12px; padding:14px 18px;
    border-bottom:1px solid var(--border); background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; flex:1; }
  .search { display:flex; gap:8px; flex:1; max-width:520px; }
  .search input { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:7px 12px; outline:none; }
  .search input:focus { border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:none; border-radius:6px;
    padding:7px 14px; cursor:pointer; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.done { background:transparent; color:var(--green); border:1px solid var(--green); cursor:default; }
  main { padding:14px 18px; overflow-y:auto; height:calc(100% - 62px); }
  .meta { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .card { display:flex; gap:14px; align-items:flex-start; background:var(--panel);
    border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:10px; }
  .card .body { flex:1; min-width:0; }
  .card h3 { margin:0 0 4px; font-size:14px; font-weight:600; }
  .card h3 code { color:var(--accent); font-weight:600; }
  .card .desc { color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .sub { color:var(--muted); font-size:11px; }
  .card .actions { display:flex; align-items:center; gap:8px; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
  .err { color:var(--danger); font-size:13px; padding:8px 0; }
  a { color:var(--accent); text-decoration:none; font-size:11px; }
  .footer { color:var(--muted); font-size:11px; padding:10px 0 20px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1 id="title">Plugin Store</h1>
  <div class="search">
    <input id="q" type="text" value="dsh-plugin">
    <button id="searchBtn">Search</button>
  </div>
</header>
<main>
  <div class="meta" id="meta"></div>
  <div id="list"></div>
  <div class="footer" id="footer"></div>
</main>
<script src="plugin-store.js"></script>
</body>
</html>
