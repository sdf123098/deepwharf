<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<script src="shell-theme.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#21262d; --text:#e6edf3; --muted:#8b949e; --accent:#4f8cff;
          --hit:#3fb950; --miss:#d29922; --write:#58a6ff; --out:#bc8cff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#ffffff; --panel:#f6f8fa; --border:#d0d7de; --text:#1f2328; --muted:#57606a; --accent:#0969da;
            --hit:#1a7f37; --miss:#9a6700; --write:#0969da; --out:#8250df; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; font-size:14px; }
  main { display:flex; flex-direction:column; height:100%; }
  .top { display:flex; align-items:center; gap:10px; padding:14px 18px 10px; }
  h1 { font-size:15px; margin:0 auto 0 0; font-weight:600; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 10px; font-size:13px; max-width:320px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .scroll { flex:1; overflow-y:auto; padding: 4px 18px 18px; }

  .hero { display:flex; gap:16px; align-items:stretch; }
  .ringcard { flex:0 0 200px; background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .ring { position:relative; width:132px; height:132px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke:var(--border); }
  .ring .arc { stroke:var(--hit); transition: stroke-dashoffset .6s cubic-bezier(.22,1,.36,1), stroke .3s; }
  .ring .val { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .val b { font-size:26px; font-weight:650; font-variant-numeric: tabular-nums; letter-spacing:-.5px; }
  .ring .val span { font-size:11px; color:var(--muted); }
  .ringcard .sub { font-size:11px; color:var(--muted); }

  .ctx { flex:1; background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; display:flex; flex-direction:column; gap:10px; justify-content:center; }
  .ctx .label { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; }
  .ctx .label b { color:var(--text); font-weight:600; font-variant-numeric: tabular-nums; }
  .bar { height:10px; border-radius:5px; background:var(--border); overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:5px; background:var(--accent);
    transition: width .6s cubic-bezier(.22,1,.36,1); }
  .bar.warn > i { background: var(--miss); }
  .ctx .legend { font-size:11px; color:var(--muted); }

  .cards { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-top:14px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .card .k { font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .card .k i { width:8px; height:8px; border-radius:3px; display:inline-block; }
  .card .v { font-size:21px; font-weight:650; margin-top:6px; font-variant-numeric: tabular-nums; letter-spacing:-.3px; }
  .card .m { height:4px; border-radius:2px; background:var(--border); margin-top:8px; overflow:hidden; }
  .card .m > i { display:block; height:100%; border-radius:2px; transition: width .6s cubic-bezier(.22,1,.36,1); }

  .comp { margin-top:14px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .comp .label { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .stack { display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--border); }
  .stack > i { display:block; height:100%; transition: width .6s cubic-bezier(.22,1,.36,1); }
  .legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; font-size:11.5px; color:var(--muted); }
  .legend em { font-style:normal; display:flex; align-items:center; gap:6px; }
  .legend em i { width:8px; height:8px; border-radius:3px; }
  .legend em b { color:var(--text); font-weight:600; font-variant-numeric: tabular-nums; }

  .empty { color:var(--muted); text-align:center; padding:60px 0; font-size:13px; line-height:1.8; }
  .live { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--hit); }
  .live i { width:7px; height:7px; border-radius:50%; background:var(--hit); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .footnote { color:var(--muted); font-size:10.5px; text-align:center; padding-top:10px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="title">用量</h1>
    <span class="live" id="live" style="display:none"><i></i><span id="liveText"></span></span>
    <select id="session"></select>
    <button id="refresh"></button>
  </div>
  <div class="scroll" id="body"></div>
  <div class="footnote" id="footnote"></div>
</main>
<script src="usage.js"></script>
</body>
</html>
