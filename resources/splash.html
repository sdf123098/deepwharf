<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<script src="shell-theme.js"></script>
<style>
  :root { --bg:#0a0e1a; --text:#e6edf3; --muted:#8b949e; --sub:#7d8aa5; --ver:#3d4a66;
          --g1:#101a33; --g2:#0a0e1a; --g3:#070a13; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f7fb; --text:#1a1f28; --muted:#5a6472; --sub:#7a8494; --ver:#a5aec0;
            --g1:#ffffff; --g2:#eef2f8; --g3:#e6ebf4; }
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg);
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--text);
    user-select: none; }
  .bg { position: fixed; inset: 0;
    background: radial-gradient(120% 120% at 50% 0%, var(--g1) 0%, var(--g2) 55%, var(--g3) 100%); }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; }
  .logo { width: 84px; height: 84px; border-radius: 20px;
    box-shadow: 0 8px 32px rgba(77, 107, 254, 0.35); }
  h1 { font-size: 19px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .sub { font-size: 12px; color: var(--sub); margin-top: -10px; }
  .status { font-size: 13px; color: var(--muted); min-height: 18px; display: flex; align-items: center; gap: 8px; }
  .spinner { width: 13px; height: 13px; border: 2px solid rgba(79,140,255,.25);
    border-top-color: #4f8cff; border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #detail { font-size: 11px; color: #f0883e; white-space: pre-wrap; text-align: center;
    max-width: 92%; word-break: break-all; }
  .v { position: absolute; bottom: 14px; width: 100%; text-align: center;
    font-size: 11px; color: var(--ver); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <img class="logo" src="brand-logo.png" alt="DeepWharf">
  <h1>DeepWharf</h1>
  <div class="sub">for DeepSeek Harness</div>
  <div class="status"><span class="spinner" id="spinner"></span><span id="status">Starting…</span></div>
  <div id="detail" style="display:none"></div>
  <div class="v" id="version"></div>
</div>
</body>
</html>
