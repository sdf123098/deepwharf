appId: com.deepwharf.desktop
productName: DeepWharf

# Fast install: no compression (pure copy). The payload is already pruned; the
# installer trades download size for much quicker extraction on disk.
compression: store

directories:
  output: release
  buildResources: build

# GitHub 直连不通，Electron 发行包走 npmmirror 镜像。
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

files:
  - dist/**/*
  # Tray icon ships inside the ASAR; the main process reads it at runtime.
  - build/icon.ico
  - resources/brand-logo.png
  - resources/splash.html
  - resources/main-shell.html
  - resources/main-shell.js
  - resources/plugin-store.html
  - resources/plugin-store.js
  - resources/settings.html
  - resources/settings.js
  - resources/onboarding.html
  - resources/onboarding.js
  - resources/log-viewer.html
  - resources/log-viewer.js
  - resources/shell-theme.js
  - resources/pet.html
  - resources/pet.js
  - resources/webui-preload.js
  - resources/chrome.js
  - resources/remote.html
  - resources/remote.js
  - resources/remote.css
  # Desktop pet cutout + the companion dsh plugin (installed into DSH_HOME at
  # runtime; bundled inside the ASAR — Electron's patched fs reads it fine).
  - resources/pet/pet.png
  - resources/companion/**/*

# Phase 4/5: embedded Node runtime goes outside the ASAR.
# The Harness ships as ONE archive (harness.zip) so the installer copies a few
# files instead of ~11k; the app extracts it on first run (fast install).
extraResources:
  - from: resources/runtime
    to: runtime
  - from: resources/harness.zip
    to: harness.zip

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Pluggable code signing: scripts/sign.js is invoked for every Windows
  # artifact. Modes are selected via DEEPMHARF_SIGN_MODE:
  #   test (default) — self-signed test chain; pfx — CSC_LINK real cert;
  #   sigpath — SignPath Foundation; none — unsigned. See scripts/sign.js.
  signtoolOptions:
    sign: ./scripts/sign.js
    signingHashAlgorithms: ["sha256"]

nsis:
  # 向导式安装：可选安装范围（默认 per-user → %LOCALAPPDATA%\Programs），
  # 并允许自选安装目录（选受保护目录时安装器自动请求提权，无 UAC 一键模式）。
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # 覆盖安装 / 卸载时保留用户数据（sessions、profiles、settings 在 %APPDATA%）。
  deleteAppDataOnUninstall: false
  # 开始菜单快捷方式名称，保证按字母 D 可检索。
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: DeepWharf
  artifactName: DeepWharf-Setup-${version}-x64.${ext}

portable:
  artifactName: DeepWharf-Portable-${version}-x64.${ext}
